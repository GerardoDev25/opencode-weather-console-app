name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - id: version
        run: echo "VERSION=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.VERSION }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists != 'true'
        run: bun run typecheck

      - if: steps.check.outputs.exists != 'true'
        run: bun run build:all

      - if: steps.check.outputs.exists != 'true'
        run: |
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"

      - if: steps.check.outputs.exists != 'true'
        run: gh release create "v${{ steps.version.outputs.VERSION }}" out/weather-* --generate-notes --title "v${{ steps.version.outputs.VERSION }}"
        env:
          GH_TOKEN: ${{ github.token }}
